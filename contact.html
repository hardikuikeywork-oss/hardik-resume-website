<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><title>Contact | Hardik Uikey</title></head>
<body>
<nav><a class="brand" href="index.html">Hardik Uikey</a><ul><li><a href="index.html">About</a></li><li><a href="portfolio.html">Portfolio</a></li><li><a href="contact.html" class="current">Contact</a></li></ul></nav>
<header class="page-title"><h1>Contact</h1><p class="tagline">Say hi! I am in Nagpur and open to internships, events and collaborations.</p></header>
<main>
  <section><h2>Reach me</h2><ul class="plain"><li>Email: <a href="mailto:hardikuikeywork@gmail.com">hardikuikeywork@gmail.com</a></li><li>LinkedIn: <a href="https://www.linkedin.com/in/hardik-uikey-a30a81338/">Hardik Uikey</a></li><li>Instagram: <a href="https://www.instagram.com/hardik.bin/">@hardik.bin</a></li></ul></section>
  <section><h2>Send a message</h2>
  <form id="contact-form" action="/contact">
    <label for="name">Name</label><input type="text" id="name" name="name" required minlength="2" maxlength="40">
    <label for="email">Email</label><input type="email" id="email" name="email" required>
    <label for="topic">Topic</label><select id="topic" name="topic"><option value="internship">Internship</option><option value="event">Event or marketing work</option><option value="other">Other</option></select>
    <label for="msg">Message</label><textarea id="msg" name="msg" rows="4" required></textarea>
    <button class="btn" type="submit">Send message</button>
  </form></section>
</main>
</body></html>
